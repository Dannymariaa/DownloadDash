<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download DownloadDash Android App</title>
  <meta name="description" content="Download the DownloadDash Android app for a cleaner mobile public-link workflow." />
  <style>
    body {
      margin: 0;
      background: radial-gradient(circle at top, rgba(139,92,246,.2), transparent 38%), #050505;
      color: white;
      font-family: Arial, sans-serif;
      padding: 40px 18px;
    }
    .card {
      max-width: 820px;
      margin: 0 auto;
      border: 1px solid rgba(139,92,246,.45);
      background: rgba(255,255,255,.045);
      border-radius: 32px;
      padding: 42px;
      text-align: center;
    }
    h1 { font-size: clamp(2.4rem, 7vw, 5rem); line-height: .95; margin: 0 0 18px; }
    p { color: #a1a1aa; line-height: 1.8; }
    .btn {
      margin-top: 22px;
      border: 0;
      border-radius: 20px;
      background: linear-gradient(90deg,#9333ea,#ec4899);
      color: white;
      padding: 18px 34px;
      font-weight: 900;
      cursor: pointer;
    }
    .features {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin: 28px 0;
    }
    .features div {
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 16px;
      padding: 14px;
    }
    #status { color: #c084fc; }
    @media(max-width:600px){ .features{ grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="card">
    <h1>Install DownloadDash</h1>
    <p>Download the Android app for a cleaner mobile experience, saved collections, and public-link workflows.</p>

    <div class="features">
      <div>Real Android APK</div>
      <div>Mobile dashboard</div>
      <div>Saved collections</div>
      <div>Public-link focused</div>
    </div>

    <button class="btn" onclick="downloadApk()">Download Android APK</button>
    <p id="status"></p>

    <p>iPhone and iPad users should use Safari Add to Home Screen.</p>
  </div>

  <script>
    async function downloadApk() {
      const status = document.getElementById("status");
      const apkUrl = "/downloads/DownloadDash.apk";
      status.textContent = "Preparing your DownloadDash app download...";

      try {
        const response = await fetch(apkUrl, { method: "HEAD", cache: "no-store" });
        const size = Number(response.headers.get("content-length") || 0);

        if (!response.ok || size < 1024) {
          status.textContent = "The Android app is being prepared. Please try again later or use Add to Home Screen for now.";
          return;
        }

        const link = document.createElement("a");
        link.href = apkUrl;
        link.download = "DownloadDash.apk";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        status.textContent = "Download started. Open the APK after it finishes downloading.";
      } catch {
        status.textContent = "The app download could not start right now. Please try again later.";
      }
    }
  </script>
</body>
</html>

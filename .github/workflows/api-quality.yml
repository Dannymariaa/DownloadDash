name: API quality

on:
  push:
  pull_request:

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check app.py cache.py config.py downloader.py locks.py metrics.py proxy.py rate_limit.py security.py utils extractors scripts tests

      - name: Bandit
        run: python -m bandit -q -r app.py cache.py config.py downloader.py locks.py metrics.py proxy.py rate_limit.py security.py utils extractors scripts

      - name: mypy
        run: python -m mypy app.py cache.py config.py downloader.py locks.py metrics.py proxy.py rate_limit.py security.py

      - name: Tests with coverage
        run: |
          python -m coverage run -m unittest discover -s tests
          python -m coverage report --fail-under=95

      - name: Dependency audit
        run: python -m pip_audit -r requirements.txt

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t downloaddash-api:ci .

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
exclude = [
  "DownloadDash-API/",
  "mobile/",
  "tools/",
  "node_modules/",
]

[tool.coverage.run]
branch = true
source = [
  "app",
  "cache",
  "config",
  "downloader",
  "locks",
  "metrics",
  "proxy",
  "rate_limit",
  "security",
]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

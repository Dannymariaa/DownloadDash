[project]
name = "downloaddash-api"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
  "Flask==3.1.3",
  "flask-cors==6.0.1",
  "gunicorn==23.0.0",
  "requests==2.34.2",
  "redis==6.4.0",
  "python-dotenv==1.2.2",
  "brotli==1.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
  "DownloadDash-API/",
  "dist/",
  "mobile/",
  "node_modules/",
  "scripts/",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
norecursedirs = [
  "DownloadDash-API",
  "dist",
  "mobile",
  "node_modules",
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
exclude = [
  "DownloadDash-API/",
  "mobile/",
  "tools/",
  "node_modules/",
]

[tool.coverage.run]
branch = true
source = [
  "app",
  "cache",
  "config",
  "downloader",
  "locks",
  "metrics",
  "proxy",
  "rate_limit",
  "security",
]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

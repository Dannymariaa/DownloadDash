[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/downloads/*"
  to = "/downloads/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
